<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twisted Towers in AR</title>
  <meta name="description" content="Bahrain Bay Twisted Towers: view the 3D model in augmented reality on your phone.">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <style>
    :root { --bg: #eef2f6; --ink: #13233a; --muted: #5a6b80; --accent: #1f4f8f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
                 font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 16px 16px 4px; text-align: center; }
    h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }
    model-viewer { flex: 1; width: 100%; min-height: 60vh; background: var(--bg);
                   --progress-bar-color: var(--accent); }
    #ar-button { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
                 white-space: nowrap; border: 0; border-radius: 999px; padding: 14px 28px; font-size: 1.05rem; font-weight: 600;
                 background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
    #no-ar { position: absolute; left: 16px; right: 16px; bottom: 20px; text-align: center;
             color: var(--muted); font-size: 0.9rem; display: none; }
    footer { padding: 8px 16px 16px; text-align: center; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>Bahrain Bay Twisted Towers</h1>
    <p>Three 200 m towers, 180° twist &middot; model at 1:200 scale (about 1 m tall)</p>
  </header>

  <model-viewer id="tower"
      src="towers_ar.glb" ios-src="towers_ar.usdz"
      alt="3D model of three twisted towers connected by sky bridges"
      ar ar-modes="scene-viewer webxr quick-look" ar-placement="floor" ar-scale="auto"
      camera-controls touch-action="pan-y" auto-rotate
      camera-orbit="35deg 75deg auto" shadow-intensity="1" environment-image="neutral" exposure="1.1">
    <button slot="ar-button" id="ar-button">View in your room (AR)</button>
    <div id="no-ar">Open this page on a phone to place the towers in your room.</div>
  </model-viewer>

  <footer>Tap the button, point your camera at the floor, then move your phone slowly until the towers appear.</footer>

  <script type="module">
    const viewer = document.querySelector("#tower");
    const showHint = () => {
      if (!viewer.canActivateAR) document.querySelector("#no-ar").style.display = "block";
    };
    if (viewer.loaded) showHint(); else viewer.addEventListener("load", showHint);
  </script>
</body>
</html>
